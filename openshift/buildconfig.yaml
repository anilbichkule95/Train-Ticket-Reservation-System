apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: trainbook

---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: trainbook
spec:
  runPolicy: Serial

  source:
    type: Binary

  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile

  output:
    to:
      kind: ImageStreamTag
      name: trainbook:1.2

  triggers: []